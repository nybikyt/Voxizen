plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
    id("io.github.goooler.shadow") version "8.1.8"
}

group = 'dev.nybikyt'
version = '0.0.1'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "denizen-repo"
        url = "https://maven.citizensnpcs.co/repo"
    }
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
    maven { url = 'https://alphacephei.com/maven/' } // ← репо для Vosk
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT")
    compileOnly("com.denizenscript:denizen:1.3.1-SNAPSHOT")
    compileOnly("de.maxhenkel.voicechat:voicechat-api:2.6.0")
    implementation 'com.alphacephei:vosk:0.3.45'
    implementation 'net.java.dev.jna:jna:5.13.0'
//    implementation 'org.json:json:20231013'
}

tasks {
    shadowJar {
        archiveClassifier.set('')
//        relocate 'com.sun.jna', 'dev.nybikyt.voxizen.libs.jna'
    }
    runServer {
        minecraftVersion("1.21")
    }
    build {
        dependsOn shadowJar
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}